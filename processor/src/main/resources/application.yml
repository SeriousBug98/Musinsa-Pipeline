spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musinsa}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 테이블 자동 생성 절대 금지
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

scoring:
  weights:
    rank: 0.35            # 무신사 랭킹(매출/조회/후기 반영)이지만 플랫폼 노출 알고리즘의 영향을 받는 2차 지표
    fan: 0.25             # 관심 신호 — 구매보다 약한 신호
    soldout: 0.25         # 고객 직결제 행동 — 직접 수요 신호, 단 신상품 개수에 영향 받음
    snap: 0.25            # 스냅 UGC 버즈 상승 추세 — 실착 수요 신호
    review-velocity: 0.15 # 리뷰 증가 속도 — 적립금 인센티브로 noisy, 보조 확인 신호 (가중치 합 != 1 허용, compute()가 재정규화)
  thresholds:
    min-fan-count: 500        # fan_growth 최소 팬수
    min-rank-days: 3          # rank_change 최소 관측일
    min-fan-days: 4           # fan_growth 최소 관측일
    soldout-hold-hours: 24    # 신상품 판정 보류 시간
    soldout-shrinkage: 5.0    # 소표본 수축 강도
    min-snap-days: 3          # snap_buzz 최소 실제 등장일 (14일 창 중 실제 스냅에 나온 날 기준)
    review-hold-hours: 24     # 어린 신상품 제외 (2h 전 등장 상품 리뷰 60/day 폭주 방지)
    review-shrinkage: 5.0     # 소표본 수축 강도 (soldout과 동일 수준)
  decay-lambda: 0.231         # 지수 감쇠 λ — 반감기 3일 (ln2/3 ≈ 0.231)
  rising-brands-limit: 20
