spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musinsa}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # 테이블 자동 생성 절대 금지
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

scoring:
  weights:
    rank: 0.45
    fan: 0.35
    soldout: 0.20
  thresholds:
    min-fan-count: 500        # fan_growth 최소 팬수
    min-rank-days: 3          # rank_change 최소 관측일
    min-fan-days: 4           # fan_growth 최소 관측일
    soldout-hold-hours: 24    # 신상품 판정 보류 시간
    soldout-shrinkage: 5.0    # 소표본 수축 강도
  hot-brands-limit: 20
