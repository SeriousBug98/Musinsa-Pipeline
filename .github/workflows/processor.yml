name: processor

# 일 1회 스코어링. products(00:12 KST 시작, ~25분) 종료 후에 돌도록 01:30 KST.
on:
  schedule:
    - cron: "30 16 * * *"   # 01:30 KST
  workflow_dispatch:

jobs:
  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: processor
    env:
      TZ: Asia/Seoul  # JDBC 가 세션 timezone 을 JVM 기본값으로 설정 → NOW() 비교가 KST wall-clock 기준이 되도록
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # bootJar 만 — build/test 는 DB_USER 가 있으면 통합 테스트가 운영 DB 에 돌기 때문에 DB 환경변수 없이 빌드
      - run: ./gradlew bootJar --no-daemon
      - name: Run scoring (batch profile)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: java -jar build/libs/processor-0.0.1-SNAPSHOT.jar --spring.profiles.active=batch
