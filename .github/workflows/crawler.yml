name: crawler

# 기존 APScheduler 스케줄(KST)을 UTC cron으로 옮김. 정각은 Actions 부하로 지연이 잦아 분을 비켜 둠.
# 각 cron 문자열이 작업 하나에 대응하므로 문자열을 바꾸면 아래 case 문도 함께 바꿀 것.
on:
  schedule:
    - cron: "2 15 * * *"            # fans        00:02 KST
    - cron: "12 15,21,3,9 * * *"    # products    00:12 / 06:12 / 12:12 / 18:12 KST
    - cron: "12 17,23,5,11 * * *"   # rankings    02:12 / 08:12 / 14:12 / 20:12 KST
    - cron: "22 18 * * *"           # brand_list  03:22 KST
    - cron: "12 4 * * *"            # snaps       13:12 KST (DAILY 스냅 랭킹 정오 갱신 후)
  workflow_dispatch:
    inputs:
      job:
        description: 실행할 수집 작업
        required: true
        type: choice
        options: [brand_list, rankings, fans, products, snaps]

run-name: crawler ${{ inputs.job || github.event.schedule }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # products 1회 30~50분
    defaults:
      run:
        working-directory: crawler
    env:
      TZ: Asia/Seoul        # 타임스탬프는 KST wall-clock 으로 저장하는 규칙
      PGSSLMODE: require    # Neon 은 SSL 필수
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Resolve job
        id: job
        env:
          INPUT_JOB: ${{ inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "2 15 * * *")          job=fans ;;
            "12 15,21,3,9 * * *")  job=products ;;
            "12 17,23,5,11 * * *") job=rankings ;;
            "22 18 * * *")         job=brand_list ;;
            "12 4 * * *")          job=snaps ;;
            *)                     job="$INPUT_JOB" ;;
          esac
          [ -n "$job" ] || { echo "unknown schedule: $SCHEDULE"; exit 1; }
          echo "name=$job" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r requirements.txt
      - run: python main.py --job ${{ steps.job.outputs.name }}
